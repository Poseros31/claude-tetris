name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure taxonomy labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create bug --color d73a4a --description "Algo no funciona como se espera" --force
          gh label create enhancement --color a2eeef --description "Nueva funcionalidad o mejora" --force
          gh label create question --color d876e3 --description "Se necesita más información" --force
          gh label create documentation --color 0075ca --description "Mejoras o correcciones a la documentación" --force
          gh label create rendering --color fbca04 --description "Dibujo en canvas: draw(), drawNext()" --force
          gh label create controls-input --color 1d76db --description "Manejo de teclado / controles" --force
          gh label create scoring-level --color 5319e7 --description "Puntaje, líneas, nivel, velocidad de caída" --force
          gh label create rotation-collision --color e99695 --description "Rotación de piezas, wall kicks, colisiones" --force
          gh label create performance --color 0e8a16 --description "Rendimiento del loop de juego / renderizado" --force

      - name: Run Claude issue triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_non_write_users: "*"
          prompt: "/triage-issue REPO: ${{ github.repository }} ISSUE_NUMBER: ${{ github.event.issue.number }}. El comentario de diagnóstico que publiques debe estar en formato Markdown que GitHub pueda renderizar correctamente."
          claude_args: '--allowedTools "Bash(./scripts/gh.sh:*),Bash(./scripts/edit-issue-labels.sh:*),Bash(./scripts/post-diagnosis-comment.sh:*)"'
